suite: namespace restriction webhooks
templates:
  - charts/dynamo-operator/templates/webhook-configuration.yaml
  - charts/dynamo-operator/templates/webhook-service.yaml
  - charts/dynamo-operator/templates/webhook-certificates.yaml
tests:
  - it: renders global admission for the cluster-wide installation
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    asserts:
      - hasDocuments:
          count: 2
      - notExists:
          path: webhooks[0].namespaceSelector
        documentIndex: 0
      - notExists:
          path: webhooks[0].namespaceSelector
        documentIndex: 1

  - it: renders no admission configurations for a namespaced installation
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only validation scoped to the target namespace when explicitly enabled
    template: charts/dynamo-operator/templates/webhook-configuration.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.namespaceRestriction.runNamespacedValidation: true
      dynamo-operator.namespaceRestriction.targetNamespace: tenant-a
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ValidatingWebhookConfiguration
      - equal:
          path: metadata.name
          value: RELEASE-NAME-dynamo-operator-NAMESPACE-validating
      - lengthEqual:
          path: webhooks
          count: 5
      - equal:
          path: webhooks[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: tenant-a
      - equal:
          path: webhooks[4].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: tenant-a

  - it: renders no webhook service for a namespaced installation
    template: charts/dynamo-operator/templates/webhook-service.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a webhook service for explicit namespaced validation
    template: charts/dynamo-operator/templates/webhook-service.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.namespaceRestriction.runNamespacedValidation: true
      dynamo-operator.upgradeCRD: false
    asserts:
      - hasDocuments:
          count: 1

  - it: renders no webhook certificates for a namespaced installation
    template: charts/dynamo-operator/templates/webhook-certificates.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.upgradeCRD: false
      dynamo-operator.webhook.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders webhook certificates for explicit namespaced validation
    template: charts/dynamo-operator/templates/webhook-certificates.yaml
    set:
      dynamo-operator.namespaceRestriction.enabled: true
      dynamo-operator.namespaceRestriction.runNamespacedValidation: true
      dynamo-operator.upgradeCRD: false
      dynamo-operator.webhook.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 4
